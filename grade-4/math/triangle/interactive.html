<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>三角形专项（交互版）</title>
<style>
  :root {
    --primary: #2563eb; --primary-bg: #eff6ff; --ink: #111827; --soft: #6b7280;
    --card-border: #e5e7eb; --ans-bg: #f0fdf4; --ans-border: #86efac;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Noto Sans CJK SC", "Songti SC", serif;
    font-size: 18px; color: var(--ink); background: #f8fafc;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; background: #fff;
    border-bottom: 1px solid var(--card-border);
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  header h1 { font-size: 19px; text-align: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-btn {
    flex: 0 0 auto; min-width: 92px; min-height: 50px; border: none; border-radius: 12px;
    background: var(--primary); color: #fff; font-size: 17px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
  }
  .page-btn:active { transform: scale(.96); background: #1d4ed8; }
  .page-btn:disabled { background: #cbd5e1; }
  main { flex: 1; overflow-y: auto; padding: 16px 14px 20px; max-width: 900px; width: 100%; margin: 0 auto; }
  .section-title { font-size: 24px; margin-bottom: 8px; padding-left: 12px; border-left: 5px solid var(--primary); }
  .idea {
    font-size: 16.5px; color: var(--soft); background: var(--primary-bg);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; line-height: 1.65;
  }
  .idea b { color: var(--primary); }
  .card {
    background: #fff; border: 1px solid var(--card-border); border-radius: 14px;
    padding: 16px 16px 14px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
    cursor: pointer; touch-action: manipulation; transition: box-shadow .12s;
  }
  .card:active { box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  .card .q { font-size: 19px; line-height: 1.7; }
  .tag {
    display: inline-block; font-size: 15px; font-weight: 700; color: #fff;
    border-radius: 7px; padding: 2px 9px; margin-right: 8px; vertical-align: 1px;
  }
  .tag.example { background: var(--primary); }
  .tag.practice { background: #0d9488; }
  .badge {
    display: inline-block; font-size: 13px; font-weight: 600; color: #b45309;
    background: #fff7ed; border: 1px solid #fdba74; border-radius: 6px;
    padding: 0 6px; margin-left: 6px; vertical-align: 2px;
  }
  .ans {
    display: none; margin-top: 12px; padding: 13px 15px;
    background: var(--ans-bg); border: 1px solid var(--ans-border); border-radius: 10px;
    font-size: 17.5px; line-height: 1.75;
  }
  .card.open .ans { display: block; }
  .ans b { color: #15803d; }
  .q svg.inline-fig {
    display: block; max-width: 55%; height: auto; margin: 10px auto 2px;
  }
  @media (max-width: 720px) { .q svg.inline-fig { max-width: 100%; } }
  .hint { font-size: 13px; color: #9ca3af; text-align: right; margin-top: 6px; }
  footer {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px 14px; background: #fff; border-top: 1px solid var(--card-border);
    position: sticky; bottom: 0; z-index: 10;
  }
  footer .page-btn { min-width: 110px; }
  .ghost-btn {
    min-height: 44px; border: 1px solid var(--primary); border-radius: 12px;
    background: #fff; color: var(--primary); font-size: 16px; padding: 0 16px;
    cursor: pointer; touch-action: manipulation;
  }
  .ghost-btn:active { background: var(--primary-bg); }
  .page-ind { font-size: 16px; color: var(--soft); font-weight: 600; min-width: 90px; text-align: center; }
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.42);
    z-index: 20; display: none;
  }
  .drawer-overlay.show { display: block; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 80%; max-width: 320px;
    background: #fff; z-index: 21; overflow-y: auto;
    transform: translateX(-100%); transition: transform .22s;
    padding: 16px 12px 24px; box-shadow: 2px 0 12px rgba(0,0,0,.12);
  }
  .drawer.show { transform: translateX(0); }
  .drawer h3 {
    font-size: 14px; color: var(--soft); font-weight: 600;
    margin: 14px 6px 6px; padding-bottom: 4px; border-bottom: 1px solid var(--card-border);
  }
  .drawer a {
    display: block; padding: 12px 10px; font-size: 16px; color: var(--ink);
    text-decoration: none; border-radius: 8px; line-height: 1.4;
  }
  .drawer a:active { background: var(--primary-bg); }
  .drawer a.active { color: var(--primary); font-weight: 600; background: var(--primary-bg); }
  .drawer .home-link { margin-top: 10px; color: var(--primary); font-weight: 600; }
  @media (max-width: 720px) {
    body { font-size: 17px; } header h1 { font-size: 16px; }
    .page-btn { min-width: 76px; min-height: 46px; font-size: 15px; }
    main { padding: 12px 10px 16px; } .card .q { font-size: 18px; }
  }
</style>
</head>

<script>
const pages = [{"title":"一、内角和与角度计算","idea":"三角形内角和 = 180°；直角三角形两个锐角互余；角平分线把角分成相等的两半。求角时常用\"整体与部分\"：先算能算出的角，再倒推出要求的角。题目里没说某个角是\"顶角\"还是\"底角\"时，要分类讨论。","problems":[{"tag":"例","n":1,"level":"","text":"一个三角形的两个角分别是 47° 和 68°，第三个角是多少度？","ans":"∠BOC = 90° + ∠A ÷ 2 = 90° + 38° = <b>128°</b>。规律：三角形两内角平分线的交角 = 90° + 第三个角的一半。","img":"fig-1-1"},{"tag":"例","n":2,"level":"","text":"直角三角形中，一个锐角是 38°，另一个锐角是多少度？如果两个锐角的差是 22°，它们各是多少度？","ans":"∠1 + ∠2 = <b>130°</b>。推导：连接 AA′，折叠得 DA = DA′、EA = EA′（对应边相等），所以 △DAA′、△EAA′ 都是等腰三角形，∠DAA′ = ∠DA′A = x、∠EAA′ = ∠EA′A = y，且 x + y = ∠A = 65°。由外角定理，∠1 = ∠BDA′ = 2x、∠2 = ∠A′EC = 2y。∠1 + ∠2 = 2(x + y) = 2 × 65° = <b>130°</b>。规律：折叠后顶点落到内部时，折角之和 = 2 × 顶角。","img":"fig-1-2"},{"tag":"例","n":3,"level":"提高","text":"三角形 ABC 中，∠A = 70°。E 是三角形内一点，BE、CE 分别是 ∠B、∠C 的角平分线。求 ∠BEC 的度数。","ans":"设最小角 x°，最大角 5x°，另一角 = 180° − 6x°。它必须夹在中间：x ≤ 180 − 6x ≤ 5x。由 x ≤ 180 − 6x 得 x ≤ 25（180 ÷ 7 ≈ 25.7，取整 25）；由 180 − 6x ≤ 5x 得 x ≥ 17（180 ÷ 11 ≈ 16.36，取整 17）。x 最大取 <b>25°</b>，最大角 = 5 × 25 = <b>125°</b>。验算三个角 25°、30°、125°，和 180° ✓。","img":"fig-1-3"},{"tag":"例","n":4,"level":"提高","text":"三角形中，∠B 比 ∠A 大 20°，∠C 又比 ∠B 大 20°。三个角各是多少度？","ans":"设每个外角 x°，则相邻内角 4x°。外角 + 内角 = 180°，5x = 180，x = 36°。外角和恒为 360°，360° ÷ 36° = <b>10</b>，是<b>正十边形</b>。"},{"tag":"练","n":1,"level":"","text":"一个三角形的两个角分别是 25° 和 75°，第三个角是多少度？","ans":"∠BOC = 90° + ∠A ÷ 2 = 110°，所以 ∠A ÷ 2 = 20°，<b>∠A = 40°</b>。"},{"tag":"练","n":2,"level":"","text":"直角三角形中，两个锐角的差是 18°，它们各是多少度？","ans":"折角之和 = 2 × 顶角：∠1 + ∠2 = 60° + 80° = 140° = 2∠A，<b>∠A = 70°</b>。"},{"tag":"练","n":3,"level":"提高","text":"一个等腰三角形中有一个角是 40°，另外两个角分别是多少度？","ans":"三个数要尽量都接近平均数 180 ÷ 3 = 60°，且互不相等，取 <b>59°、60°、61°</b>，最大角最小 = <b>61°</b>。"}]},{"title":"二、多边形内角和与外角和","idea":"n 边形内角和 = (n − 2) × 180°；任意多边形外角和 = 360°；正多边形每个内角 = 内角和 ÷ 边数，每个外角 = 360° ÷ 边数。给\"内角和\"求边数，就把它除以 180° 再加 2。","problems":[{"tag":"例","n":1,"level":"","text":"求五边形、六边形的内角和。","ans":"∠BOC = 90° + ∠A ÷ 2 = 90° + 38° = <b>128°</b>。规律：三角形两内角平分线的交角 = 90° + 第三个角的一半。","img":"fig-2-1"},{"tag":"例","n":2,"level":"","text":"一个多边形的内角和是 1080°，它是几边形？如果它是正多边形，一个内角是多少度？","ans":"∠1 + ∠2 = <b>130°</b>。推导：连接 AA′，折叠得 DA = DA′、EA = EA′（对应边相等），所以 △DAA′、△EAA′ 都是等腰三角形，∠DAA′ = ∠DA′A = x、∠EAA′ = ∠EA′A = y，且 x + y = ∠A = 65°。由外角定理，∠1 = ∠BDA′ = 2x、∠2 = ∠A′EC = 2y。∠1 + ∠2 = 2(x + y) = 2 × 65° = <b>130°</b>。规律：折叠后顶点落到内部时，折角之和 = 2 × 顶角。","img":"fig-2-2"},{"tag":"例","n":3,"level":"提高","text":"五角星有 5 个相等的尖角，这 5 个尖角的度数和是多少？","ans":"设最小角 x°，最大角 5x°，另一角 = 180° − 6x°。它必须夹在中间：x ≤ 180 − 6x ≤ 5x。由 x ≤ 180 − 6x 得 x ≤ 25（180 ÷ 7 ≈ 25.7，取整 25）；由 180 − 6x ≤ 5x 得 x ≥ 17（180 ÷ 11 ≈ 16.36，取整 17）。x 最大取 <b>25°</b>，最大角 = 5 × 25 = <b>125°</b>。验算三个角 25°、30°、125°，和 180° ✓。","img":"fig-2-3"},{"tag":"例","n":4,"level":"提高","text":"一个多边形的外角和是它的内角和的一半，这个多边形是几边形？","ans":"设每个外角 x°，则相邻内角 4x°。外角 + 内角 = 180°，5x = 180，x = 36°。外角和恒为 360°，360° ÷ 36° = <b>10</b>，是<b>正十边形</b>。"},{"tag":"练","n":1,"level":"","text":"求正九边形一个内角的度数。","ans":"∠BOC = 90° + ∠A ÷ 2 = 110°，所以 ∠A ÷ 2 = 20°，<b>∠A = 40°</b>。"},{"tag":"练","n":2,"level":"","text":"一个多边形的内角和是 1260°，它是几边形？","ans":"折角之和 = 2 × 顶角：∠1 + ∠2 = 60° + 80° = 140° = 2∠A，<b>∠A = 70°</b>。"},{"tag":"练","n":3,"level":"提高","text":"一个正多边形每个外角都是 60°，它是几边形？","ans":"三个数要尽量都接近平均数 180 ÷ 3 = 60°，且互不相等，取 <b>59°、60°、61°</b>，最大角最小 = <b>61°</b>。"}]},{"title":"三、综合挑战","idea":"把复杂图形拆成一个个三角形，综合运用内角和、三边关系、等腰等边性质。图形拼接时，\"外轮廓的边数 = 各部分边数之和 − 2 × 共用边数\"；求\"最长/最短\"\"最大/最小\"时要先定出取值范围，再找极端。","problems":[{"tag":"例","n":1,"level":"提高","text":"把一个正方形和一个等边三角形拼在一起，它们共用一条边，且分居这条边的两侧。拼成的图形的外轮廓是几边形？它的内角和是多少度？","ans":"∠BOC = 90° + ∠A ÷ 2 = 90° + 38° = <b>128°</b>。规律：三角形两内角平分线的交角 = 90° + 第三个角的一半。","img":"fig-3-1"},{"tag":"例","n":2,"level":"进阶","text":"一个三角形的三条边都是整厘米数，其中两条边分别是 6cm 和 8cm。第三条边最长与最短相差多少厘米？","ans":"∠1 + ∠2 = <b>130°</b>。推导：连接 AA′，折叠得 DA = DA′、EA = EA′（对应边相等），所以 △DAA′、△EAA′ 都是等腰三角形，∠DAA′ = ∠DA′A = x、∠EAA′ = ∠EA′A = y，且 x + y = ∠A = 65°。由外角定理，∠1 = ∠BDA′ = 2x、∠2 = ∠A′EC = 2y。∠1 + ∠2 = 2(x + y) = 2 × 65° = <b>130°</b>。规律：折叠后顶点落到内部时，折角之和 = 2 × 顶角。"},{"tag":"例","n":3,"level":"挑战","text":"一个三角形的最大角是最小角的 3 倍，另一个角是最小角的 2 倍。三个角各是多少度？按角分是什么三角形？","ans":"设最小角 x°，最大角 5x°，另一角 = 180° − 6x°。它必须夹在中间：x ≤ 180 − 6x ≤ 5x。由 x ≤ 180 − 6x 得 x ≤ 25（180 ÷ 7 ≈ 25.7，取整 25）；由 180 − 6x ≤ 5x 得 x ≥ 17（180 ÷ 11 ≈ 16.36，取整 17）。x 最大取 <b>25°</b>，最大角 = 5 × 25 = <b>125°</b>。验算三个角 25°、30°、125°，和 180° ✓。"},{"tag":"例","n":4,"level":"挑战","text":"三角形三个内角的度数都是整数，最大角是最小角的 3 倍。最小角最大可能是多少度？此时按角分是什么三角形？","ans":"设每个外角 x°，则相邻内角 4x°。外角 + 内角 = 180°，5x = 180，x = 36°。外角和恒为 360°，360° ÷ 36° = <b>10</b>，是<b>正十边形</b>。"},{"tag":"练","n":1,"level":"提高","text":"一个五边形剪去一个三角形后，剩下的图形最多是几边形？它的内角和是多少度？","ans":"∠BOC = 90° + ∠A ÷ 2 = 110°，所以 ∠A ÷ 2 = 20°，<b>∠A = 40°</b>。"},{"tag":"练","n":2,"level":"进阶","text":"一个等腰三角形的周长是 28cm，底边比一条腰长 4cm。三条边各是多少厘米？","ans":"折角之和 = 2 × 顶角：∠1 + ∠2 = 60° + 80° = 140° = 2∠A，<b>∠A = 70°</b>。"},{"tag":"练","n":3,"level":"提高","text":"把一个正方形沿一条对角线剪开，得到两个三角形。每个三角形的三个角分别是多少度？","ans":"三个数要尽量都接近平均数 180 ÷ 3 = 60°，且互不相等，取 <b>59°、60°、61°</b>，最大角最小 = <b>61°</b>。","img":"fig-3-3"}]},{"title":"四、高难挑战","idea":"这一部分要用到三个\"秘密武器\"——① 三角形外角定理：外角 = 与它不相邻的两个内角之和；② n 角星尖角和 = 180° × (n − 4)；③ 不管凹还是凸，n 边形内角和永远是 (n − 2) × 180°。遇到极值问题，先用\"内角和 180°\"把三个角用一个未知数表示，再列出大小关系求范围。","problems":[{"tag":"例","n":1,"level":"外角定理","text":"把三角形 ABC 的边 BC 延长到 D，∠ACD 是三角形的一个外角。已知 ∠A = 50°，∠B = 65°。（1）∠ACD 是多少度？（2）观察一下，外角 ∠ACD 和 ∠A、∠B 有什么关系？","ans":"∠BOC = 90° + ∠A ÷ 2 = 90° + 38° = <b>128°</b>。规律：三角形两内角平分线的交角 = 90° + 第三个角的一半。","img":"fig-4-1"},{"tag":"例","n":2,"level":"n 角星","text":"五角星的 5 个尖角的和是 180°。照这样的规律，六角星的 6 个尖角和是多少？七角星的 7 个尖角和呢？","ans":"∠1 + ∠2 = <b>130°</b>。推导：连接 AA′，折叠得 DA = DA′、EA = EA′（对应边相等），所以 △DAA′、△EAA′ 都是等腰三角形，∠DAA′ = ∠DA′A = x、∠EAA′ = ∠EA′A = y，且 x + y = ∠A = 65°。由外角定理，∠1 = ∠BDA′ = 2x、∠2 = ∠A′EC = 2y。∠1 + ∠2 = 2(x + y) = 2 × 65° = <b>130°</b>。规律：折叠后顶点落到内部时，折角之和 = 2 × 顶角。"},{"tag":"例","n":3,"level":"凹多边形","text":"有一个图形，它有 6 条边，但其中有一个角是\"凹\"进去的（像一个弯折的箭头）。它的内角和是多少？","ans":"设最小角 x°，最大角 5x°，另一角 = 180° − 6x°。它必须夹在中间：x ≤ 180 − 6x ≤ 5x。由 x ≤ 180 − 6x 得 x ≤ 25（180 ÷ 7 ≈ 25.7，取整 25）；由 180 − 6x ≤ 5x 得 x ≥ 17（180 ÷ 11 ≈ 16.36，取整 17）。x 最大取 <b>25°</b>，最大角 = 5 × 25 = <b>125°</b>。验算三个角 25°、30°、125°，和 180° ✓。","img":"fig-4-3"},{"tag":"例","n":4,"level":"极值推理","text":"三角形三个内角的度数都是整数，最大角与最小角相差 45°。最大角最小可能是多少度？","ans":"设每个外角 x°，则相邻内角 4x°。外角 + 内角 = 180°，5x = 180，x = 36°。外角和恒为 360°，360° ÷ 36° = <b>10</b>，是<b>正十边形</b>。"},{"tag":"练","n":1,"level":"等差角","text":"一个三角形的三个内角成等差数列（即相邻两角的差相等），最小的角是 40°。最大的角是多少度？","ans":"∠BOC = 90° + ∠A ÷ 2 = 110°，所以 ∠A ÷ 2 = 20°，<b>∠A = 40°</b>。"},{"tag":"练","n":2,"level":"对角线分割","text":"一个八边形，从一个顶点出发最多能引几条对角线？这些对角线能把八边形分成几个三角形？","ans":"折角之和 = 2 × 顶角：∠1 + ∠2 = 60° + 80° = 140° = 2∠A，<b>∠A = 70°</b>。"},{"tag":"练","n":3,"level":"内外角关系","text":"一个正多边形的每个外角恰好是相邻内角的一半。这个正多边形是几边形？","ans":"三个数要尽量都接近平均数 180 ÷ 3 = 60°，且互不相等，取 <b>59°、60°、61°</b>，最大角最小 = <b>61°</b>。"},{"tag":"练","n":4,"level":"极值推理","text":"三角形三个内角都是整数，最大角是最小角的 4 倍。最大角最大可能是多少度？","ans":"设最小角 x°，最大角 (x + 50)°，另一角 = 180° − x − (x + 50) = (130 − 2x)°。它必须夹在中间：x ≤ 130 − 2x ≤ x + 50。由 x ≤ 130 − 2x 得 x ≤ 43；由 130 − 2x ≤ x + 50 得 x ≥ 27。x = 27、28、…、43，共 43 − 27 + 1 = <b>17 个</b>。"}]},{"title":"五、竞赛挑战","idea":"竞赛题的突破口，是\"先找一个立刻能算出来的角当跳板\"。三大跳板：三角形内角和 180°、平角 180°、三角形外角定理（外角 = 不相邻两内角之和）。记牢两条常用规律：① 两角平分线的交角 = 90° + 顶角的一半；② 折纸折叠的本质是轴对称——对应边相等、对应角相等，折叠后顶点落到内部时，两个折角之和 = 2 × 原顶角。","problems":[{"tag":"例","n":1,"level":"角平分线交角","text":"三角形 ABC 中，∠A = 76°，∠B、∠C 的角平分线交于点 O。求 ∠BOC 的度数。","ans":"∠BOC = 90° + ∠A ÷ 2 = 90° + 38° = <b>128°</b>。规律：三角形两内角平分线的交角 = 90° + 第三个角的一半。","img":"fig-5-1"},{"tag":"例","n":2,"level":"折叠规律","text":"把三角形纸片 ABC 沿折痕 DE 折叠（D 在边 AB 上、E 在边 AC 上），使顶点 A 落到三角形内部的点 A′。折叠后，折痕与边 AB 相交的 D 点处出现折角 ∠A′DB，记作 ∠1；折痕与边 AC 相交的 E 点处出现折角 ∠A′EC，记作 ∠2。已知 ∠A = 65°，求 ∠1 + ∠2 的度数。","ans":"∠1 + ∠2 = <b>130°</b>。推导：连接 AA′，折叠得 DA = DA′、EA = EA′（对应边相等），所以 △DAA′、△EAA′ 都是等腰三角形，∠DAA′ = ∠DA′A = x、∠EAA′ = ∠EA′A = y，且 x + y = ∠A = 65°。由外角定理，∠1 = ∠BDA′ = 2x、∠2 = ∠A′EC = 2y。∠1 + ∠2 = 2(x + y) = 2 × 65° = <b>130°</b>。规律：折叠后顶点落到内部时，折角之和 = 2 × 顶角。","img":"fig-5-2"},{"tag":"例","n":3,"level":"比例极值","text":"三角形三个内角都是整数度，最小角与最大角的比是 1:5。最大角最大可能是多少度？","ans":"设最小角 x°，最大角 5x°，另一角 = 180° − 6x°。它必须夹在中间：x ≤ 180 − 6x ≤ 5x。由 x ≤ 180 − 6x 得 x ≤ 25（180 ÷ 7 ≈ 25.7，取整 25）；由 180 − 6x ≤ 5x 得 x ≥ 17（180 ÷ 11 ≈ 16.36，取整 17）。x 最大取 <b>25°</b>，最大角 = 5 × 25 = <b>125°</b>。验算三个角 25°、30°、125°，和 180° ✓。"},{"tag":"例","n":4,"level":"内外角倍比","text":"一个正多边形，每个内角恰好是一个外角的 4 倍，它是几边形？","ans":"设每个外角 x°，则相邻内角 4x°。外角 + 内角 = 180°，5x = 180，x = 36°。外角和恒为 360°，360° ÷ 36° = <b>10</b>，是<b>正十边形</b>。"},{"tag":"练","n":1,"level":"角平分线逆向","text":"三角形 ABC 中，∠B、∠C 的角平分线交于点 O，∠BOC = 110°。求 ∠A。","ans":"∠BOC = 90° + ∠A ÷ 2 = 110°，所以 ∠A ÷ 2 = 20°，<b>∠A = 40°</b>。"},{"tag":"练","n":2,"level":"折叠应用","text":"把三角形纸片沿折痕折叠，使顶点 A 落到内部，测得两个折角 ∠1 = 60°、∠2 = 80°。原来的顶角 ∠A 是多少度？","ans":"折角之和 = 2 × 顶角：∠1 + ∠2 = 60° + 80° = 140° = 2∠A，<b>∠A = 70°</b>。"},{"tag":"练","n":3,"level":"互异极值","text":"三角形三个内角都是整数且互不相等，最大角最小可能是多少度？","ans":"三个数要尽量都接近平均数 180 ÷ 3 = 60°，且互不相等，取 <b>59°、60°、61°</b>，最大角最小 = <b>61°</b>。"},{"tag":"练","n":4,"level":"枚举计数","text":"三角形三个内角都是整数度，最大的角比最小的角大 50°。这样的三角形有多少个？","ans":"设最小角 x°，最大角 (x + 50)°，另一角 = 180° − x − (x + 50) = (130 − 2x)°。它必须夹在中间：x ≤ 130 − 2x ≤ x + 50。由 x ≤ 130 − 2x 得 x ≤ 43；由 130 − 2x ≤ x + 50 得 x ≥ 27。x = 27、28、…、43，共 43 − 27 + 1 = <b>17 个</b>。"}]}];
const siblings = [];
const homeUrl = 'https://gavanx.github.io/study-materials/';

let cur = Math.min(Math.max((parseInt(new URLSearchParams(location.search).get('page')) || 0), 0), pages.length - 1);
const view = document.getElementById('view');
const titleEl = document.getElementById('title');
const pageInd = document.getElementById('pageInd');
const toggleAllBtn = document.getElementById('toggleAllBtn');
let allOpen = false;

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const p = pages[cur];
  titleEl.textContent = p.title;
  pageInd.textContent = (cur + 1) + ' / ' + pages.length;

  let html = '<div class="section-title">' + escapeHtml(p.title) + '</div>';
  html += '<div class="idea">' + p.idea.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</div>';

  p.problems.forEach((pr, idx) => {
    const tagCls = pr.tag === '例' ? 'example' : 'practice';
    const badge = pr.level ? ' <span class="badge">' + escapeHtml(pr.level) + '</span>' : '';
    const open = allOpen ? ' open' : '';
    const img = pr.img ? '<svg class="inline-fig" data-src="' + escapeHtml(pr.img) + '"></svg>' : '';
    html += '<div class="card' + open + '" data-i="' + idx + '">'
      + '<div class="q"><span class="tag ' + tagCls + '">' + pr.tag + pr.n + '</span>'
      + escapeHtml(pr.text) + badge + img
      + '<div class="hint">' + (open ? '点一下收起答案' : '点一下看答案') + '</div>'
      + '<div class="ans">' + pr.ans + '</div>'
      + '</div></div>';
  });

  view.innerHTML = html;

  view.querySelectorAll('svg[data-src]').forEach(holder => {
    const lib = document.getElementById('svgLib');
    if (!lib) return;
    const tpl = lib.querySelector('#' + holder.getAttribute('data-src'));
    if (tpl) holder.replaceWith(tpl.cloneNode(true));
  });

  view.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      card.classList.toggle('open');
      const hint = card.querySelector('.hint');
      if (hint) hint.textContent = card.classList.contains('open') ? '点一下收起答案' : '点一下看答案';
    });
  });
}

function prevPage() { if (cur > 0) { cur--; render(); } }
function nextPage() { if (cur < pages.length - 1) { cur++; render(); } }
function toggleAll() {
  allOpen = !allOpen;
  toggleAllBtn.textContent = allOpen ? '全部收起' : '全部展开';
  render();
}

function goHome() { location.href = homeUrl; }

function showDrawer(show) {
  document.getElementById('drawerOverlay').classList.toggle('show', show);
  document.getElementById('drawer').classList.toggle('show', show);
}

function fillDrawer() {
  const topics = document.getElementById('drawerTopics');
  topics.innerHTML = '';
  pages.forEach((p, i) => {
    const a = document.createElement('a');
    a.textContent = p.title;
    a.href = '?page=' + i;
    a.className = i === cur ? 'active' : '';
    a.addEventListener('click', e => { e.preventDefault(); cur = i; render(); showDrawer(false); });
    topics.appendChild(a);
  });
  const sb = document.getElementById('drawerSiblings');
  if (siblings && siblings.length) {
    sb.innerHTML = '';
    siblings.forEach(s => {
      const a = document.createElement('a');
      a.textContent = s.name;
      a.href = s.url;
      sb.appendChild(a);
    });
  }
}

document.getElementById('menuBtn').addEventListener('click', () => { fillDrawer(); showDrawer(true); });
document.getElementById('drawerOverlay').addEventListener('click', () => showDrawer(false));
document.getElementById('homeBtn').addEventListener('click', goHome);
document.getElementById('drawerHome').addEventListener('click', goHome);
document.getElementById('prevBtnB').addEventListener('click', prevPage);
document.getElementById('nextBtnB').addEventListener('click', nextPage);
toggleAllBtn.addEventListener('click', toggleAll);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevPage();
  if (e.key === 'ArrowRight') nextPage();
});

render();
</script>
</body>
</html>
