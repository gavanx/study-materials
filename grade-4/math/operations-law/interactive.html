<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>运算定律与简便计算（交互版）</title>
<style>
  :root {
    --primary: #2563eb; --primary-bg: #eff6ff; --ink: #111827; --soft: #6b7280;
    --card-border: #e5e7eb; --ans-bg: #f0fdf4; --ans-border: #86efac;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Noto Sans CJK SC", "Songti SC", serif;
    font-size: 18px; color: var(--ink); background: #f8fafc;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; background: #fff;
    border-bottom: 1px solid var(--card-border);
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  header h1 { font-size: 19px; text-align: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-btn {
    flex: 0 0 auto; min-width: 92px; min-height: 50px; border: none; border-radius: 12px;
    background: var(--primary); color: #fff; font-size: 17px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
  }
  .page-btn:active { transform: scale(.96); background: #1d4ed8; }
  .page-btn:disabled { background: #cbd5e1; }
  main { flex: 1; overflow-y: auto; padding: 16px 14px 20px; max-width: 900px; width: 100%; margin: 0 auto; }
  .section-title { font-size: 24px; margin-bottom: 8px; padding-left: 12px; border-left: 5px solid var(--primary); }
  .idea {
    font-size: 16.5px; color: var(--soft); background: var(--primary-bg);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; line-height: 1.65;
  }
  .idea b { color: var(--primary); }
  .card {
    background: #fff; border: 1px solid var(--card-border); border-radius: 14px;
    padding: 16px 16px 14px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
    cursor: pointer; touch-action: manipulation; transition: box-shadow .12s;
  }
  .card:active { box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  .card .q { font-size: 19px; line-height: 1.7; }
  .tag {
    display: inline-block; font-size: 15px; font-weight: 700; color: #fff;
    border-radius: 7px; padding: 2px 9px; margin-right: 8px; vertical-align: 1px;
  }
  .tag.example { background: var(--primary); }
  .tag.practice { background: #0d9488; }
  .badge {
    display: inline-block; font-size: 13px; font-weight: 600; color: #b45309;
    background: #fff7ed; border: 1px solid #fdba74; border-radius: 6px;
    padding: 0 6px; margin-left: 6px; vertical-align: 2px;
  }
  .ans {
    display: none; margin-top: 12px; padding: 13px 15px;
    background: var(--ans-bg); border: 1px solid var(--ans-border); border-radius: 10px;
    font-size: 17.5px; line-height: 1.75;
  }
  .card.open .ans { display: block; }
  .ans b { color: #15803d; }
  .q svg.inline-fig {
    display: block; max-width: 55%; height: auto; margin: 10px auto 2px;
  }
  @media (max-width: 720px) { .q svg.inline-fig { max-width: 100%; } }
  .hint { font-size: 13px; color: #9ca3af; text-align: right; margin-top: 6px; }
  footer {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px 14px; background: #fff; border-top: 1px solid var(--card-border);
    position: sticky; bottom: 0; z-index: 10;
  }
  footer .page-btn { min-width: 110px; }
  .ghost-btn {
    min-height: 44px; border: 1px solid var(--primary); border-radius: 12px;
    background: #fff; color: var(--primary); font-size: 16px; padding: 0 16px;
    cursor: pointer; touch-action: manipulation;
  }
  .ghost-btn:active { background: var(--primary-bg); }
  .page-ind { font-size: 16px; color: var(--soft); font-weight: 600; min-width: 90px; text-align: center; }
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.42);
    z-index: 20; display: none;
  }
  .drawer-overlay.show { display: block; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 80%; max-width: 320px;
    background: #fff; z-index: 21; overflow-y: auto;
    transform: translateX(-100%); transition: transform .22s;
    padding: 16px 12px 24px; box-shadow: 2px 0 12px rgba(0,0,0,.12);
  }
  .drawer.show { transform: translateX(0); }
  .drawer h3 {
    font-size: 14px; color: var(--soft); font-weight: 600;
    margin: 14px 6px 6px; padding-bottom: 4px; border-bottom: 1px solid var(--card-border);
  }
  .drawer a {
    display: block; padding: 12px 10px; font-size: 16px; color: var(--ink);
    text-decoration: none; border-radius: 8px; line-height: 1.4;
  }
  .drawer a:active { background: var(--primary-bg); }
  .drawer a.active { color: var(--primary); font-weight: 600; background: var(--primary-bg); }
  .drawer .home-link { margin-top: 10px; color: var(--primary); font-weight: 600; }
  @media (max-width: 720px) {
    body { font-size: 17px; } header h1 { font-size: 16px; }
    .page-btn { min-width: 76px; min-height: 46px; font-size: 15px; }
    main { padding: 12px 10px 16px; } .card .q { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <button class="page-btn" id="menuBtn" aria-label="目录">☰ 目录</button>
  <h1 id="title">运算定律与简便计算</h1>
  <button class="page-btn" id="homeBtn" aria-label="首页">🏠 首页</button>
</header>

<main id="view"></main>

<footer>
  <button class="page-btn" id="prevBtnB">‹ 上一页</button>
  <span class="page-ind" id="pageInd">1 / 1</span>
  <button class="page-btn" id="nextBtnB">下一页 ›</button>
  <button class="ghost-btn" id="toggleAllBtn">全部展开</button>
</footer>

<div class="drawer-overlay" id="drawerOverlay"></div>
<nav class="drawer" id="drawer">
  <h3>本专题目录</h3>
  <div id="drawerTopics"></div>
  <h3>切换专题</h3>
  <div id="drawerSiblings"></div>
  <a class="home-link" id="drawerHome" href="https://gavanx.github.io/study-materials/">🏠 返回首页</a>
</nav>

<div id="svgLib" style="display:none"></div>

<script>
const pages = [{"title":"一、交换律与结合律","idea":"加法交换律——交换两个加数位置和不变；乘法交换律——交换两个因数位置积不变；加法/乘法结合律——改变运算顺序结果不变。目的只有一个：<b>凑整</b>。牢记黄金搭档：25×4=100、125×8=1000、37×3=111。","problems":[{"tag":"例","n":1,"level":"","text":"简便计算：25 + 47 + 75","ans":"25 + 47 + 75 = 25 + 75 + 47 = 100 + 47 = <b>147</b>。"},{"tag":"例","n":2,"level":"","text":"简便计算：25 × 17 × 4","ans":"25 × 17 × 4 = 25 × 4 × 17 = 100 × 17 = <b>1700</b>。"},{"tag":"例","n":3,"level":"提高","text":"简便计算：125 × 25 × 8 × 4","ans":"125 × 25 × 8 × 4 = (125 × 8) × (25 × 4) = 1000 × 100 = <b>100000</b>。"},{"tag":"练","n":1,"level":"","text":"简便计算：45 + 36 + 55","ans":"45 + 36 + 55 = 45 + 55 + 36 = 100 + 36 = <b>136</b>。"},{"tag":"练","n":2,"level":"","text":"简便计算：8 × 13 × 125","ans":"8 × 13 × 125 = 8 × 125 × 13 = 1000 × 13 = <b>13000</b>。"},{"tag":"练","n":3,"level":"提高","text":"简便计算：2 × 17 × 5 × 3","ans":"2 × 17 × 5 × 3 = (2 × 5) × (17 × 3) = 10 × 51 = <b>510</b>。"}]},{"title":"二、乘法分配律","idea":"正向——(a + b) × c = a × c + b × c，把\"合在一起乘\"变成\"分开乘再相加\"；逆向——a × c + b × c = (a + b) × c，把相同的因数（公因数）提出来\"合起来乘\"。逆向时，式子末尾若只有一个数，如 88×99 + 88，要想到 88 = 88×1，补上一个\"×1\"再提取。","problems":[{"tag":"例","n":1,"level":"","text":"用两种方法计算 (25 + 11) × 4，并比较结果。","ans":"方法一（先算括号）：(25 + 11) × 4 = 36 × 4 = 144。方法二（分配）：25 × 4 + 11 × 4 = 100 + 44 = 144。结果相同，说明 (a + b) × c = a × c + b × c。"},{"tag":"例","n":2,"level":"","text":"简便计算：37 × 18 + 37 × 82","ans":"37 × 18 + 37 × 82 = 37 × (18 + 82) = 37 × 100 = <b>3700</b>。"},{"tag":"例","n":3,"level":"提高","text":"简便计算：99 × 24","ans":"99 × 24 = (100 − 1) × 24 = 100 × 24 − 24 = 2400 − 24 = <b>2376</b>。"},{"tag":"例","n":4,"level":"提高","text":"简便计算：56 × 101 和 48 × 99","ans":"56 × 101 = 56 × (100 + 1) = 5600 + 56 = <b>5656</b>。48 × 99 = 48 × (100 − 1) = 4800 − 48 = <b>4752</b>。"},{"tag":"练","n":1,"level":"","text":"简便计算：(50 + 3) × 8","ans":"(50 + 3) × 8 = 50 × 8 + 3 × 8 = 400 + 24 = <b>424</b>。"},{"tag":"练","n":2,"level":"","text":"简便计算：25 × 99 + 25","ans":"25 × 99 + 25 = 25 × (99 + 1) = 25 × 100 = <b>2500</b>。（最后的 25 看成 25 × 1）"},{"tag":"练","n":3,"level":"提高","text":"简便计算：36 × 102","ans":"36 × 102 = 36 × (100 + 2) = 3600 + 72 = <b>3672</b>。"}]},{"title":"三、减法与除法的性质","idea":"连减性质——一个数连续减去两个数，等于减去它们的和：a − b − c = a − (b + c)；连除性质——一个数连续除以两个数，等于除以它们的积：a ÷ b ÷ c = a ÷ (b × c)。看到减数或除数能凑整，就\"合起来减/除\"。","problems":[{"tag":"例","n":1,"level":"","text":"简便计算：854 − 248 − 152","ans":"854 − 248 − 152 = 854 − (248 + 152) = 854 − 400 = <b>454</b>。"},{"tag":"例","n":2,"level":"","text":"简便计算：600 ÷ 25 ÷ 4","ans":"600 ÷ 25 ÷ 4 = 600 ÷ (25 × 4) = 600 ÷ 100 = <b>6</b>。"},{"tag":"例","n":3,"level":"提高","text":"简便计算：586 − 199","ans":"586 − 199 = 586 − 200 + 1 = 386 + 1 = <b>387</b>。（减 199 看作减 200，多减了 1 要加回）"},{"tag":"练","n":1,"level":"","text":"简便计算：728 − 183 − 217","ans":"728 − 183 − 217 = 728 − (183 + 217) = 728 − 400 = <b>328</b>。"},{"tag":"练","n":2,"level":"","text":"简便计算：800 ÷ 25 ÷ 8","ans":"800 ÷ 25 ÷ 8 = 800 ÷ (25 × 8) = 800 ÷ 200 = <b>4</b>。"},{"tag":"练","n":3,"level":"提高","text":"简便计算：742 − 398","ans":"742 − 398 = 742 − 400 + 2 = <b>344</b>。（减 398 看作减 400，多减了 2 要加回）"}]},{"title":"四、简便计算综合","idea":"先观察数的特征再选方法——见到 25、125 想乘 4、8 凑整；见到 99、101 想\"100 ± 1\"；一串全是 9 的数，逐个拆成\"整十/整百 − 1\"。算式中所有因数位置可以任意交换（带符号搬家），目的是让它们两两配对凑整。","problems":[{"tag":"例","n":1,"level":"带符号搬家","text":"简便计算：125 × 17 × 8","ans":"125 × 17 × 8 = 125 × 8 × 17 = 1000 × 17 = <b>17000</b>。"},{"tag":"例","n":2,"level":"拆数凑整","text":"简便计算：25 × 32 × 125","ans":"25 × 32 × 125 = 25 × 4 × 8 × 125 = (25 × 4) × (8 × 125) = 100 × 1000 = <b>100000</b>。（32 拆成 4 × 8）"},{"tag":"例","n":3,"level":"连续凑整","text":"简便计算：9 + 99 + 999 + 9999","ans":"9 + 99 + 999 + 9999 = (10 − 1) + (100 − 1) + (1000 − 1) + (10000 − 1) = 11110 − 4 = <b>11106</b>。"},{"tag":"例","n":4,"level":"配对求和","text":"简便计算：1 + 2 + 3 + … + 99 + 100","ans":"首尾配对：(1 + 100) × 100 ÷ 2 = 101 × 50 = <b>5050</b>。"},{"tag":"练","n":1,"level":"","text":"简便计算：25 × 36","ans":"25 × 36 = 25 × 4 × 9 = 100 × 9 = <b>900</b>。"},{"tag":"练","n":2,"level":"","text":"简便计算：101 × 45","ans":"101 × 45 = 45 × 100 + 45 = 4500 + 45 = <b>4545</b>。"},{"tag":"练","n":3,"level":"提高","text":"简便计算：8 + 98 + 998 + 9998","ans":"8 + 98 + 998 + 9998 = (10 − 2) + (100 − 2) + (1000 − 2) + (10000 − 2) = 11110 − 8 = <b>11102</b>。"}]},{"title":"五、高难挑战","idea":"高难算式没有现成的公因数，要自己\"造\"出来——拆数、补 1、看倍数关系。核心动作：① 单独一个数当它是 ×1；② 把一个数拆成\"公因数 × 倍数\"，让各部分出现同一个公因数。","problems":[{"tag":"例","n":1,"level":"提取公因数","text":"简便计算：88 × 88 + 88 × 11 + 88","ans":"88 × 88 + 88 × 11 + 88 = 88 × (88 + 11 + 1) = 88 × 100 = <b>8800</b>。"},{"tag":"例","n":2,"level":"补 1 变形","text":"简便计算：37 × 101 − 37","ans":"37 × 101 − 37 = 37 × (101 − 1) = 37 × 100 = <b>3700</b>。（最后这个 37 是 37 × 1）"},{"tag":"例","n":3,"level":"分组提取","text":"简便计算：3333 × 3334 + 2222 × 9999","ans":"2222 × 9999 = 2222 × (3333 × 3) = 6666 × 3333。原式 = 3333 × 3334 + 6666 × 3333 = 3333 × (3334 + 6666) = 3333 × 10000 = <b>33330000</b>。"},{"tag":"例","n":4,"level":"凑整变式","text":"简便计算：999 × 999 + 1999","ans":"999 × 999 + 1999 = 999 × 999 + 999 + 1000 = 999 × (999 + 1) + 1000 = 999 × 1000 + 1000 = 999000 + 1000 = <b>1000000</b>。（把 1999 拆成 999 + 1000）"},{"tag":"练","n":1,"level":"","text":"简便计算：85 × 99 + 85","ans":"85 × 99 + 85 = 85 × (99 + 1) = 85 × 100 = <b>8500</b>。"},{"tag":"练","n":2,"level":"","text":"简便计算：444 × 25","ans":"444 × 25 = 111 × 4 × 25 = 111 × 100 = <b>11100</b>。（444 拆成 111 × 4）"},{"tag":"练","n":3,"level":"","text":"简便计算：999 × 222 + 333 × 334","ans":"999 × 222 + 333 × 334 = 333 × 3 × 222 + 333 × 334 = 333 × 666 + 333 × 334 = 333 × (666 + 334) = 333 × 1000 = <b>333000</b>。"},{"tag":"练","n":4,"level":"","text":"简便计算：2022 × 2021 − 2021 × 2020","ans":"2022 × 2021 − 2021 × 2020 = 2021 × (2022 − 2020) = 2021 × 2 = <b>4042</b>。"}]},{"title":"六、竞赛挑战","idea":"竞赛题里数字大、项数多，突破口是\"找规律、分组合并\"。注意两点：① 提取公因数时，把一个数补成 ×1，如 123 × 98 + 123 × 3 − 123 里最后那个 123 是 123 × 1；② 长长的一串加减式，先两两分组看每组结果，再数一数有几组。","problems":[{"tag":"例","n":1,"level":"提取公因数","text":"简便计算：123 × 98 + 123 × 3 − 123","ans":"123 × 98 + 123 × 3 − 123 = 123 × (98 + 3 − 1) = 123 × 100 = <b>12300</b>。"},{"tag":"例","n":2,"level":"补公因数","text":"简便计算：25 × 17 + 25 × 81 + 50","ans":"25 × 17 + 25 × 81 + 50 = 25 × 17 + 25 × 81 + 25 × 2 = 25 × (17 + 81 + 2) = 25 × 100 = <b>2500</b>。"},{"tag":"例","n":3,"level":"连续凑整","text":"简便计算：9 + 99 + 999 + 9999 + 99999","ans":"9 + 99 + 999 + 9999 + 99999 = (10 − 1) + (100 − 1) + (1000 − 1) + (10000 − 1) + (100000 − 1) = 111110 − 5 = <b>111105</b>。"},{"tag":"例","n":4,"level":"奇偶配对","text":"简便计算：2020 − 2019 + 2018 − 2017 + … + 4 − 3 + 2 − 1","ans":"两两分组：(2020 − 2019) + (2018 − 2017) + … + (2 − 1)，每组都是 1。2020 个数分成 2020 ÷ 2 = 1010 组，和 = 1 × 1010 = <b>1010</b>。"},{"tag":"练","n":1,"level":"","text":"简便计算：37 × 48 + 53 × 37 − 37","ans":"37 × 48 + 53 × 37 − 37 = 37 × (48 + 53 − 1) = 37 × 100 = <b>3700</b>。"},{"tag":"练","n":2,"level":"","text":"简便计算：25 × 73 + 25 × 26 + 25","ans":"25 × 73 + 25 × 26 + 25 = 25 × (73 + 26 + 1) = 25 × 100 = <b>2500</b>。"},{"tag":"练","n":3,"level":"","text":"简便计算：9999 × 8 + 1111 × 28","ans":"9999 × 8 + 1111 × 28 = 1111 × 9 × 8 + 1111 × 28 = 1111 × 72 + 1111 × 28 = 1111 × (72 + 28) = 1111 × 100 = <b>111100</b>。"},{"tag":"练","n":4,"level":"","text":"简便计算：1000 + 999 − 998 + 997 − 996 + … + 3 − 2 + 1","ans":"1000 + (999 − 998) + (997 − 996) + … + (3 − 2) + 1。从 999 到 2 共 998 个数，两两一组得 499 个\"1\"。和 = 1000 + 499 + 1 = <b>1500</b>。"}]}];
const siblings = [];
const homeUrl = 'https://gavanx.github.io/study-materials/';

let cur = Math.min(Math.max((parseInt(new URLSearchParams(location.search).get('page')) || 0), 0), pages.length - 1);
const view = document.getElementById('view');
const titleEl = document.getElementById('title');
const pageInd = document.getElementById('pageInd');
const toggleAllBtn = document.getElementById('toggleAllBtn');
let allOpen = false;

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const p = pages[cur];
  titleEl.textContent = p.title;
  pageInd.textContent = (cur + 1) + ' / ' + pages.length;

  let html = '<div class="section-title">' + escapeHtml(p.title) + '</div>';
  html += '<div class="idea">' + p.idea.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</div>';

  p.problems.forEach((pr, idx) => {
    const tagCls = pr.tag === '例' ? 'example' : 'practice';
    const badge = pr.level ? ' <span class="badge">' + escapeHtml(pr.level) + '</span>' : '';
    const open = allOpen ? ' open' : '';
    const img = pr.img ? '<svg class="inline-fig" data-src="' + escapeHtml(pr.img) + '"></svg>' : '';
    html += '<div class="card' + open + '" data-i="' + idx + '">'
      + '<div class="q"><span class="tag ' + tagCls + '">' + pr.tag + pr.n + '</span>'
      + escapeHtml(pr.text) + badge + img
      + '<div class="hint">' + (open ? '点一下收起答案' : '点一下看答案') + '</div>'
      + '<div class="ans">' + pr.ans + '</div>'
      + '</div></div>';
  });

  view.innerHTML = html;

  view.querySelectorAll('svg[data-src]').forEach(holder => {
    const lib = document.getElementById('svgLib');
    if (!lib) return;
    const tpl = lib.querySelector('#' + holder.getAttribute('data-src'));
    if (tpl) holder.replaceWith(tpl.cloneNode(true));
  });

  view.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      card.classList.toggle('open');
      const hint = card.querySelector('.hint');
      if (hint) hint.textContent = card.classList.contains('open') ? '点一下收起答案' : '点一下看答案';
    });
  });
}

function prevPage() { if (cur > 0) { cur--; render(); } }
function nextPage() { if (cur < pages.length - 1) { cur++; render(); } }
function toggleAll() {
  allOpen = !allOpen;
  toggleAllBtn.textContent = allOpen ? '全部收起' : '全部展开';
  render();
}

function goHome() { location.href = homeUrl; }

function showDrawer(show) {
  document.getElementById('drawerOverlay').classList.toggle('show', show);
  document.getElementById('drawer').classList.toggle('show', show);
}

function fillDrawer() {
  const topics = document.getElementById('drawerTopics');
  topics.innerHTML = '';
  pages.forEach((p, i) => {
    const a = document.createElement('a');
    a.textContent = p.title;
    a.href = '?page=' + i;
    a.className = i === cur ? 'active' : '';
    a.addEventListener('click', e => { e.preventDefault(); cur = i; render(); showDrawer(false); });
    topics.appendChild(a);
  });
  const sb = document.getElementById('drawerSiblings');
  if (siblings && siblings.length) {
    sb.innerHTML = '';
    siblings.forEach(s => {
      const a = document.createElement('a');
      a.textContent = s.name;
      a.href = s.url;
      sb.appendChild(a);
    });
  }
}

document.getElementById('menuBtn').addEventListener('click', () => { fillDrawer(); showDrawer(true); });
document.getElementById('drawerOverlay').addEventListener('click', () => showDrawer(false));
document.getElementById('homeBtn').addEventListener('click', goHome);
document.getElementById('drawerHome').addEventListener('click', goHome);
document.getElementById('prevBtnB').addEventListener('click', prevPage);
document.getElementById('nextBtnB').addEventListener('click', nextPage);
toggleAllBtn.addEventListener('click', toggleAll);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevPage();
  if (e.key === 'ArrowRight') nextPage();
});

render();
</script>
</body>
</html>
