<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <style>
    .shape{fill:none;stroke:#111827;stroke-width:2}
    .lb{font-family:serif;font-size:17px;font-weight:bold;fill:#111827}
    .val{font-family:serif;font-size:15px;fill:#374151}
  </style>
  <!-- 正方形 5x5 -->
  <rect class="shape" x="40" y="30" width="150" height="150"/>
  <!-- 中间挖去三角形（底4 高2） -->
  <polygon class="shape" points="60,90 170,90 115,150"/>
  <text class="lb" x="42" y="195">5cm</text>
  <text class="val" x="185" y="120">挖去三角</text>
</svg>
