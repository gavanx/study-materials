<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>多边形面积预习（交互版）</title>
<style>
  :root {
    --primary: #2563eb; --primary-bg: #eff6ff; --ink: #111827; --soft: #6b7280;
    --card-border: #e5e7eb; --ans-bg: #f0fdf4; --ans-border: #86efac;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Noto Sans CJK SC", "Songti SC", serif;
    font-size: 18px; color: var(--ink); background: #f8fafc;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; background: #fff;
    border-bottom: 1px solid var(--card-border);
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  header h1 { font-size: 19px; text-align: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-btn {
    flex: 0 0 auto; min-width: 92px; min-height: 50px; border: none; border-radius: 12px;
    background: var(--primary); color: #fff; font-size: 17px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
  }
  .page-btn:active { transform: scale(.96); background: #1d4ed8; }
  .page-btn:disabled { background: #cbd5e1; }
  main { flex: 1; overflow-y: auto; padding: 16px 14px 20px; max-width: 900px; width: 100%; margin: 0 auto; }
  .section-title { font-size: 24px; margin-bottom: 8px; padding-left: 12px; border-left: 5px solid var(--primary); }
  .idea {
    font-size: 16.5px; color: var(--soft); background: var(--primary-bg);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; line-height: 1.65;
  }
  .idea b { color: var(--primary); }
  .card {
    background: #fff; border: 1px solid var(--card-border); border-radius: 14px;
    padding: 16px 16px 14px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
    cursor: pointer; touch-action: manipulation; transition: box-shadow .12s;
  }
  .card:active { box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  .card .q { font-size: 19px; line-height: 1.7; }
  .tag {
    display: inline-block; font-size: 15px; font-weight: 700; color: #fff;
    border-radius: 7px; padding: 2px 9px; margin-right: 8px; vertical-align: 1px;
  }
  .tag.example { background: var(--primary); }
  .tag.practice { background: #0d9488; }
  .badge {
    display: inline-block; font-size: 13px; font-weight: 600; color: #b45309;
    background: #fff7ed; border: 1px solid #fdba74; border-radius: 6px;
    padding: 0 6px; margin-left: 6px; vertical-align: 2px;
  }
  .ans {
    display: none; margin-top: 12px; padding: 13px 15px;
    background: var(--ans-bg); border: 1px solid var(--ans-border); border-radius: 10px;
    font-size: 17.5px; line-height: 1.75;
  }
  .card.open .ans { display: block; }
  .ans b { color: #15803d; }
  .q svg.inline-fig {
    display: block; max-width: 55%; height: auto; margin: 10px auto 2px;
  }
  @media (max-width: 720px) { .q svg.inline-fig { max-width: 100%; } }
  .hint { font-size: 13px; color: #9ca3af; text-align: right; margin-top: 6px; }
  footer {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px 14px; background: #fff; border-top: 1px solid var(--card-border);
    position: sticky; bottom: 0; z-index: 10;
  }
  footer .page-btn { min-width: 110px; }
  .ghost-btn {
    min-height: 44px; border: 1px solid var(--primary); border-radius: 12px;
    background: #fff; color: var(--primary); font-size: 16px; padding: 0 16px;
    cursor: pointer; touch-action: manipulation;
  }
  .ghost-btn:active { background: var(--primary-bg); }
  .page-ind { font-size: 16px; color: var(--soft); font-weight: 600; min-width: 90px; text-align: center; }
  @media (max-width: 720px) {
    body { font-size: 17px; } header h1 { font-size: 16px; }
    .page-btn { min-width: 76px; min-height: 46px; font-size: 15px; }
    main { padding: 12px 10px 16px; } .card .q { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <button class="page-btn" id="prevBtn" aria-label="上一页">‹ 上一页</button>
  <h1 id="title">多边形面积预习</h1>
  <button class="page-btn" id="nextBtn" aria-label="下一页">下一页 ›</button>
</header>

<main id="view"></main>

<footer>
  <button class="page-btn" id="prevBtnB">‹ 上一页</button>
  <span class="page-ind" id="pageInd">1 / 1</span>
  <button class="page-btn" id="nextBtnB">下一页 ›</button>
  <button class="ghost-btn" id="toggleAllBtn">全部展开</button>
</footer>

<div id="svgLib" style="display:none"><svg id="area-1-1" xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <style>
    .shape{fill:none;stroke:#111827;stroke-width:2}
    .dash{fill:none;stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:7 5}
    .lb{font-family:serif;font-size:17px;font-weight:bold;fill:#111827}
    .val{font-family:serif;font-size:15px;fill:#374151}
  </style>
  <polygon class="shape" points="40,150 130,150 190,60 100,60"/>
  <line class="dash" x1="130" y1="150" x2="130" y2="60"/>
  <text class="lb" x="30" y="170">底(6cm)</text>
  <text class="val" x="136" y="108">高4cm</text>
</svg>

<svg id="area-2-1" xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <style>
    .shape{fill:none;stroke:#111827;stroke-width:2}
    .dash{fill:none;stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:7 5}
    .lb{font-family:serif;font-size:17px;font-weight:bold;fill:#111827}
    .val{font-family:serif;font-size:15px;fill:#374151}
  </style>
  <polygon class="shape" points="40,160 200,160 120,50"/>
  <line class="dash" x1="120" y1="160" x2="120" y2="50"/>
  <text class="lb" x="32" y="180">底(8cm)</text>
  <text class="val" x="126" y="108">高6cm</text>
</svg>

<svg id="area-3-1" xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <style>
    .shape{fill:none;stroke:#111827;stroke-width:2}
    .lb{font-family:serif;font-size:17px;font-weight:bold;fill:#111827}
    .val{font-family:serif;font-size:15px;fill:#374151}
  </style>
  <polygon class="shape" points="70,160 210,160 170,60 30,60"/>
  <text class="lb" x="62" y="180">上底4cm</text>
  <text class="lb" x="190" y="180">下底6cm</text>
  <text class="val" x="222" y="115">高5cm</text>
</svg>

<svg id="area-4-1" xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <style>
    .shape{fill:none;stroke:#111827;stroke-width:2}
    .lb{font-family:serif;font-size:17px;font-weight:bold;fill:#111827}
  </style>
  <!-- 长方形 6x4 -->
  <rect class="shape" x="40" y="120" width="180" height="120"/>
  <!-- 三角形 底6 高2，叠在长方形上 -->
  <polygon class="shape" points="40,120 220,120 130,60"/>
  <text class="lb" x="45" y="250">6m</text>
  <text class="lb" x="230" y="180">4m</text>
  <text class="lb" x="180" y="95">高2m</text>
</svg>

<svg id="area-4-2" xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <style>
    .shape{fill:none;stroke:#111827;stroke-width:2}
    .lb{font-family:serif;font-size:17px;font-weight:bold;fill:#111827}
    .val{font-family:serif;font-size:15px;fill:#374151}
  </style>
  <!-- 正方形 5x5 -->
  <rect class="shape" x="40" y="30" width="150" height="150"/>
  <!-- 中间挖去三角形（底4 高2） -->
  <polygon class="shape" points="60,90 170,90 115,150"/>
  <text class="lb" x="42" y="195">5cm</text>
  <text class="val" x="185" y="120">挖去三角</text>
</svg>
</div>

<script>
const pages = [{"title":"一、平行四边形面积","idea":"把平行四边形沿高剪开，拼成长方形，面积不变。<b>平行四边形面积 = 底 × 高</b>，用字母表示 S = ah。注意：高必须和底垂直，计算时底和高要对应。","problems":[{"tag":"例","n":1,"level":"","text":"一个平行四边形，底是 6 厘米，高是 4 厘米，面积是多少？","ans":"长方形 6 × 4 = 24，三角形 6 × 2 ÷ 2 = 6，总面积 = 24 + 6 = <b>30 平方米</b>。","img":"area-1-1"},{"tag":"例","n":2,"level":"","text":"一个平行四边形的面积是 36 平方分米，底是 9 分米，高是多少？","ans":"正方形 5 × 5 = 25，挖去三角形 4 × 2 ÷ 2 = 4，剩下 = 25 − 4 = <b>21 平方厘米</b>。"},{"tag":"例","n":3,"level":"","text":"一个平行四边形的底是 2.5 米，高是 1.2 米，面积是多少平方米？","ans":"梯形 (3 + 5) × 4 ÷ 2 = 16，长方形 3 × 4 = 12，总面积 = 16 + 12 = <b>28 平方厘米</b>。"},{"tag":"练","n":1,"level":"","text":"平行四边形底 8 厘米、高 5 厘米，面积是多少？","ans":"长方形 8 × 5 = 40，三角形 8 × 3 ÷ 2 = 12，总面积 = <b>52 平方厘米</b>。"},{"tag":"练","n":2,"level":"","text":"面积是 48 平方厘米，高是 6 厘米，底是多少？","ans":"正方形 4 × 4 = 16，去掉梯形 (1 + 2) × 4 ÷ 2 = 6，剩下 = 16 − 6 = <b>10 平方米</b>。"},{"tag":"练","n":3,"level":"","text":"平行四边形底 3.6 米、高 2 米，面积是多少平方米？","ans":"两个长方形拼成长 12 厘米、宽 3 厘米的大长方形：12 × 3 = <b>36 平方厘米</b>。"}]},{"title":"二、三角形面积","idea":"两个完全一样的三角形可以拼成一个平行四边形，所以<b>三角形面积 = 底 × 高 ÷ 2</b>，字母表示 S = ah ÷ 2。<b>别忘了除以 2</b>——这是最常错的地方。求底或高时，先乘 2 再除以已知的那个量。","problems":[{"tag":"例","n":1,"level":"","text":"一个三角形，底是 8 厘米，高是 6 厘米，面积是多少？","ans":"长方形 6 × 4 = 24，三角形 6 × 2 ÷ 2 = 6，总面积 = 24 + 6 = <b>30 平方米</b>。","img":"area-2-1"},{"tag":"例","n":2,"level":"","text":"三角形面积是 24 平方厘米，底是 8 厘米，高是多少？","ans":"正方形 5 × 5 = 25，挖去三角形 4 × 2 ÷ 2 = 4，剩下 = 25 − 4 = <b>21 平方厘米</b>。"},{"tag":"例","n":3,"level":"","text":"一个直角三角形的两条直角边分别是 3 厘米和 4 厘米，面积是多少？","ans":"梯形 (3 + 5) × 4 ÷ 2 = 16，长方形 3 × 4 = 12，总面积 = 16 + 12 = <b>28 平方厘米</b>。"},{"tag":"练","n":1,"level":"","text":"三角形底 10 厘米、高 4 厘米，面积是多少？","ans":"长方形 8 × 5 = 40，三角形 8 × 3 ÷ 2 = 12，总面积 = <b>52 平方厘米</b>。"},{"tag":"练","n":2,"level":"","text":"三角形面积是 30 平方厘米，高是 6 厘米，底是多少？","ans":"正方形 4 × 4 = 16，去掉梯形 (1 + 2) × 4 ÷ 2 = 6，剩下 = 16 − 6 = <b>10 平方米</b>。"},{"tag":"练","n":3,"level":"","text":"一个三角形底是 5.6 分米、高是 2.5 分米，面积是多少平方分米？","ans":"两个长方形拼成长 12 厘米、宽 3 厘米的大长方形：12 × 3 = <b>36 平方厘米</b>。"}]},{"title":"三、梯形面积","idea":"两个完全一样的梯形可以拼成一个平行四边形，所以<b>梯形面积 = (上底 + 下底) × 高 ÷ 2</b>，字母 S = (a + b)h ÷ 2。关键是\"上底加下底\"，别忘记括号里的加法先算。","problems":[{"tag":"例","n":1,"level":"","text":"一个梯形，上底 4 厘米、下底 6 厘米、高 5 厘米，面积是多少？","ans":"长方形 6 × 4 = 24，三角形 6 × 2 ÷ 2 = 6，总面积 = 24 + 6 = <b>30 平方米</b>。","img":"area-3-1"},{"tag":"例","n":2,"level":"","text":"梯形的上底 3.2 米、下底 4.8 米、高 2.5 米，面积是多少平方米？","ans":"正方形 5 × 5 = 25，挖去三角形 4 × 2 ÷ 2 = 4，剩下 = 25 − 4 = <b>21 平方厘米</b>。"},{"tag":"例","n":3,"level":"","text":"梯形的面积是 36 平方厘米，上底 4 厘米、下底 8 厘米，高是多少？","ans":"梯形 (3 + 5) × 4 ÷ 2 = 16，长方形 3 × 4 = 12，总面积 = 16 + 12 = <b>28 平方厘米</b>。"},{"tag":"练","n":1,"level":"","text":"梯形上底 5 厘米、下底 7 厘米、高 4 厘米，面积是多少？","ans":"长方形 8 × 5 = 40，三角形 8 × 3 ÷ 2 = 12，总面积 = <b>52 平方厘米</b>。"},{"tag":"练","n":2,"level":"","text":"梯形的上底 2.4 分米、下底 3.6 分米、高 3 分米，面积是多少？","ans":"正方形 4 × 4 = 16，去掉梯形 (1 + 2) × 4 ÷ 2 = 6，剩下 = 16 − 6 = <b>10 平方米</b>。"},{"tag":"练","n":3,"level":"","text":"梯形面积是 24 平方厘米，上底 3 厘米、高 6 厘米，下底是多少？","ans":"两个长方形拼成长 12 厘米、宽 3 厘米的大长方形：12 × 3 = <b>36 平方厘米</b>。"}]},{"title":"四、组合图形面积","idea":"组合图形用<b>割补法</b>——把它分成几个基本图形（长方形、三角形、梯形），分别算出面积再加起来；或者先补成一个完整图形，再减去补上的部分。<b>割</b>就是把不规则的拆成规则的。","problems":[{"tag":"例","n":1,"level":"","text":"一个图形由长方形（长 6 米、宽 4 米）和一个三角形（底 6 米、高 2 米）拼成，面积是多少？","ans":"长方形 6 × 4 = 24，三角形 6 × 2 ÷ 2 = 6，总面积 = 24 + 6 = <b>30 平方米</b>。","img":"area-4-1"},{"tag":"例","n":2,"level":"","text":"一个正方形边长为 5 厘米，中间挖去一个三角形（底 4 厘米、高 2 厘米），剩下的面积是多少？","ans":"正方形 5 × 5 = 25，挖去三角形 4 × 2 ÷ 2 = 4，剩下 = 25 − 4 = <b>21 平方厘米</b>。","img":"area-4-2"},{"tag":"例","n":3,"level":"","text":"求下面图形的面积：一个梯形（上底 3 厘米、下底 5 厘米、高 4 厘米）上面叠着一个同样高的长方形（宽 3 厘米、高 4 厘米）。","ans":"梯形 (3 + 5) × 4 ÷ 2 = 16，长方形 3 × 4 = 12，总面积 = 16 + 12 = <b>28 平方厘米</b>。"},{"tag":"练","n":1,"level":"","text":"长方形长 8 厘米、宽 5 厘米，上面加一个三角形（底 8 厘米、高 3 厘米），总面积是多少？","ans":"长方形 8 × 5 = 40，三角形 8 × 3 ÷ 2 = 12，总面积 = <b>52 平方厘米</b>。"},{"tag":"练","n":2,"level":"","text":"一个边长 4 米的正方形，去掉一个梯形（上底 1 米、下底 2 米、高 4 米），剩下面积是多少？","ans":"正方形 4 × 4 = 16，去掉梯形 (1 + 2) × 4 ÷ 2 = 6，剩下 = 16 − 6 = <b>10 平方米</b>。"},{"tag":"练","n":3,"level":"","text":"两个完全一样的长方形（长 6 厘米、宽 3 厘米）拼成一个大长方形，大长方形的面积是多少？","ans":"两个长方形拼成长 12 厘米、宽 3 厘米的大长方形：12 × 3 = <b>36 平方厘米</b>。"}]}];

let cur = 0;
const view = document.getElementById('view');
const titleEl = document.getElementById('title');
const pageInd = document.getElementById('pageInd');
const toggleAllBtn = document.getElementById('toggleAllBtn');
let allOpen = false;

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const p = pages[cur];
  titleEl.textContent = p.title;
  pageInd.textContent = (cur + 1) + ' / ' + pages.length;

  let html = '<div class="section-title">' + escapeHtml(p.title) + '</div>';
  html += '<div class="idea">' + p.idea.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</div>';

  p.problems.forEach((pr, idx) => {
    const tagCls = pr.tag === '例' ? 'example' : 'practice';
    const badge = pr.level ? ' <span class="badge">' + escapeHtml(pr.level) + '</span>' : '';
    const open = allOpen ? ' open' : '';
    const img = pr.img ? '<svg class="inline-fig" data-src="' + escapeHtml(pr.img) + '"></svg>' : '';
    html += '<div class="card' + open + '" data-i="' + idx + '">'
      + '<div class="q"><span class="tag ' + tagCls + '">' + pr.tag + pr.n + '</span>'
      + escapeHtml(pr.text) + badge + img
      + '<div class="hint">' + (open ? '点一下收起答案' : '点一下看答案') + '</div>'
      + '<div class="ans">' + pr.ans + '</div>'
      + '</div></div>';
  });

  view.innerHTML = html;

  view.querySelectorAll('svg[data-src]').forEach(holder => {
    const lib = document.getElementById('svgLib');
    if (!lib) return;
    const tpl = lib.querySelector('#' + holder.getAttribute('data-src'));
    if (tpl) holder.replaceWith(tpl.cloneNode(true));
  });

  view.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      card.classList.toggle('open');
      const hint = card.querySelector('.hint');
      if (hint) hint.textContent = card.classList.contains('open') ? '点一下收起答案' : '点一下看答案';
    });
  });
}

function prevPage() { if (cur > 0) { cur--; render(); } }
function nextPage() { if (cur < pages.length - 1) { cur++; render(); } }
function toggleAll() {
  allOpen = !allOpen;
  toggleAllBtn.textContent = allOpen ? '全部收起' : '全部展开';
  render();
}

document.getElementById('prevBtn').addEventListener('click', prevPage);
document.getElementById('nextBtn').addEventListener('click', nextPage);
document.getElementById('prevBtnB').addEventListener('click', prevPage);
document.getElementById('nextBtnB').addEventListener('click', nextPage);
toggleAllBtn.addEventListener('click', toggleAll);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevPage();
  if (e.key === 'ArrowRight') nextPage();
});

render();
</script>
</body>
</html>
